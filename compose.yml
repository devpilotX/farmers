services:
  database:
    image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
    environment:
      POSTGRES_DB: terrafort
      POSTGRES_USER: terrafort
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - terrafort_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrafort -d terrafort"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  terrafort_database:
